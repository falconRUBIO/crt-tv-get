plugins {
    id 'com.android.application'
}

android {
    namespace 'tv.crt.test'
    compileSdk 34

    defaultConfig {
        applicationId 'tv.crt.test'
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName '0.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
